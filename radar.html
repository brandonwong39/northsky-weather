<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NorthSky | Canadian Radar</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#071320;color:#eef7ff;font:15px system-ui,sans-serif}header{padding:12px 16px;background:#10243a;display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0}#map{height:calc(100dvh - 235px);min-height:310px;background:#152e43}.panel{padding:12px 16px;background:#10243a;display:grid;gap:10px}button,select,input{font:inherit}button,select{background:#1c3c5c;color:white;border:1px solid #54708a;border-radius:7px;padding:8px}button:focus-visible{outline:2px solid #fff}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls input[type=range]{flex:1;min-width:120px}#status{font-size:12px;color:#c5d8ea}#legend img{max-width:100%;max-height:65px;object-fit:contain;background:#f1f4f7;border-radius:3px}small{color:#bdd0df}a{color:#9bd9ff}body.full #map{height:calc(100dvh - 70px)}body.full .panel{position:absolute;bottom:0;left:0;right:0;z-index:1000;background:#10243af2}body.full #map{height:100dvh}body.full header{display:none}</style></head><body><header><h1>🌦 NorthSky Radar</h1><a href="index.html">← Home</a></header><div id="map" role="application" aria-label="Interactive weather radar map"></div><section class="panel"><div class="controls"><select id="layer" aria-label="Radar layer"><option value="RADAR_1KM_RRAI">Observed rain</option><option value="RADAR_1KM_RSNO">Observed snow</option><option value="Radar_1km_RainPrecipRate-Extrapolation">Future rain extrapolation</option><option value="Radar_1km_SnowPrecipRate-Extrapolation">Future snow extrapolation</option></select><button id="full">Full screen</button><button id="refresh">Refresh</button></div><div class="controls"><button id="back" aria-label="Previous frame">◀</button><button id="play">▶ Play</button><button id="next" aria-label="Next frame">▶|</button><input type="range" id="timeline" min="0" max="0" value="0" aria-label="Radar time"><select id="speed" aria-label="Playback speed"><option value="1400">Slow</option><option value="700" selected>Normal</option><option value="300">Fast</option></select></div><div id="status" aria-live="polite">Loading radar times…</div><div id="legend"><small>Radar intensity (official GeoMet legend)</small><div><img id="legendImage" alt="Official radar intensity legend"></div></div><small>Source: Environment and Climate Change Canada / GeoMet. Extrapolation is a short-term prediction, not an observation. Map © OpenStreetMap contributors.</small></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const base='https://geo.weather.gc.ca/geomet';const map=L.map('map',{zoomControl:true}).setView([55,-106],4);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);const layerEl=document.querySelector('#layer'),status=document.querySelector('#status'),slider=document.querySelector('#timeline'),play=document.querySelector('#play');let radar=null,times=[],index=0,timer=null;const stop=()=>{clearInterval(timer);timer=null;play.textContent='▶ Play'};function timeText(s){return new Date(s).toLocaleString('en-CA',{timeZone:'UTC',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' UTC'}function show(){if(!times.length)return;index=Math.min(Math.max(index,0),times.length-1);slider.value=index;const params={layers:layerEl.value,format:'image/png',transparent:true,version:'1.1.1',time:times[index]};if(radar)map.removeLayer(radar);radar=L.tileLayer.wms(base,params).addTo(map);status.textContent=`${index+1}/${times.length} • ${timeText(times[index])} • ${layerEl.selectedOptions[0].text}`;}function expandTime(raw){const parts=raw.trim().split('/');if(parts.length===3&&parts[2].startsWith('P')){const a=Date.parse(parts[0]),b=Date.parse(parts[1]);const match=parts[2].match(/^PT(?:(\d+)H)?(?:(\d+)M)?/);const step=match?((Number(match[1]||0)*60+Number(match[2]||0))*60000):0;if(step>0&&b>=a){let arr=[];for(let t=a;t<=b&&arr.length<300;t+=step)arr.push(new Date(t).toISOString().replace('.000Z','Z'));return arr}}return raw.split(',').map(x=>x.trim()).filter(x=>!x.includes('/')&&x.length>10)}async function load(){stop();status.textContent='Loading official radar timestamps…';const name=layerEl.value;const url=`${base}?service=WMS&version=1.3.0&request=GetCapabilities&layer=${encodeURIComponent(name)}&_=${Date.now()}`;try{const res=await fetch(url);if(!res.ok)throw Error('GeoMet responded '+res.status);const xml=new DOMParser().parseFromString(await res.text(),'application/xml');if(xml.querySelector('parsererror'))throw Error('Invalid service response');const layers=[...xml.getElementsByTagName('Layer')];const match=layers.find(l=>[...l.children].some(c=>c.localName==='Name'&&c.textContent.trim()===name));if(!match)throw Error('Radar layer unavailable');const dims=[...match.children].filter(e=>e.localName==='Dimension'||e.localName==='Extent');const dimension=dims.find(e=>(e.getAttribute('name')||'').toLowerCase()==='time');if(!dimension)throw Error('No radar timestamps advertised');times=expandTime(dimension.textContent);if(!times.length)throw Error('No usable radar frames currently available');slider.max=times.length-1;index=times.length-1;document.querySelector('#legendImage').src=`${base}?service=WMS&version=1.3.0&request=GetLegendGraphic&format=image/png&layer=${encodeURIComponent(name)}`;show()}catch(e){times=[];slider.max=0;if(radar){map.removeLayer(radar);radar=null}status.textContent='Unable to load radar: '+e.message+'. Try Refresh later.'}}layerEl.addEventListener('change',load);document.querySelector('#refresh').onclick=load;document.querySelector('#back').onclick=()=>{stop();index--;show()};document.querySelector('#next').onclick=()=>{stop();index++;show()};slider.oninput=()=>{stop();index=Number(slider.value);show()};play.onclick=()=>{if(timer){stop();return}if(!times.length)return;play.textContent='❚❚ Pause';timer=setInterval(()=>{index=(index+1)%times.length;show()},Number(document.querySelector('#speed').value))};document.querySelector('#speed').onchange=()=>{if(timer){stop();play.click()}};document.querySelector('#full').onclick=()=>{document.body.classList.toggle('full');document.querySelector('#full').textContent=document.body.classList.contains('full')?'Exit full screen':'Full screen';setTimeout(()=>map.invalidateSize(),150)};load();</script></body></html>
